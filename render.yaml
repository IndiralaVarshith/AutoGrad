# Render Blueprint for AutoGrade: the backend and the frontend, both on Render.
services:
  # Backend: one always-on Docker container.
  - type: web
    name: autograde-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Free plan: it sleeps after about 15 idle minutes and has no disk, so queued sheets are lost
    # and everyone is signed out when it sleeps or redeploys. For real use, switch to "starter"
    # and add a disk (name: autograde-data, mountPath: /data, sizeGB: 1).
    plan: free
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: COOKIE_SECURE
        value: "true"

  # Frontend: a free static site. Requests to /api/... are forwarded to the backend, so the
  # site has one address and the sign-in cookie works in every browser.
  - type: web
    name: autograde-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      # If Render gives the backend a different address, change it here (and in the dashboard).
      - type: rewrite
        source: /api/*
        destination: https://autograde-backend-26z3.onrender.com/*
